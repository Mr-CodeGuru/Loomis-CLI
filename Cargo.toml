[package]
name = "loomiscli"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
arrow = "58.4.0"
crossterm = "0.28.1"
futures-util = "0.3.34"
lancedb = { version = "0.38.0", features = ["remote"] }
parquet = "58.4.0"
pulldown-cmark = "0.13.0"
ratatui = "0.29.0"
reqwest = { version = "0.13.4", features = ["json", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
syntect = { version = "5.3.0", default-features = false, features = ["default-syntaxes", "default-themes", "html", "regex-fancy"] }
tokio = { version = "1.53.1", features = ["full"] }
tui-textarea = { version = "0.7.0", default-features = false, features = ["crossterm", "ratatui"] }

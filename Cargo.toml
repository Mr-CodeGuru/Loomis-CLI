[package]
name = "loomiscli"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
arrow = "59.3.0"
candle-core = "0.11.0"
candle-nn = "0.11.0"
candle-transformers = "0.11.0"
hf-hub = "1.0.0"
lancedb = "0.38.0"
parquet = "59.3.0"
reqwest = { version = "0.13.4", features = ["json", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokenizers = "0.23.2"
tokio = { version = "1.53.1", features = ["full"] }
